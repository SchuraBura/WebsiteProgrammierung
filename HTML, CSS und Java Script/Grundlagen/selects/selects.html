<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <title>Selects</title>
        <link rel="stylesheet" type="text/css" href="">
    </head>

    <body>

        <select name="obst" size="6" multiple>

            <option value="apfel">Apfel</option>
            <option value="brine">Orange</option>
            <option value="orange">Birne</option>
            <option value="mango" selected>Mango</option>

        </select>

        

        <select name="obsthändler">

            <optgroup label="Obst">

            <option value="apfel">Apfel</option>
            <option value="brine">Orange</option>
            <option value="orange">Birne</option>
            <option value="mango">Mango</option> 

            </optgroup>

            <optgroup label="Gemüse">

            <option value="kartoffel">Kartoffeln</option>
            <option value="karotte">Karotte</option>
            <option value="brokkoli">Brokkoli</option>
            <option value="gurke">Gurke</option> 

            </optgroup>

        </select>

    </body>

</html>
